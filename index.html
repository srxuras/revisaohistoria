<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisões da Profª Ana Clara</title>
<meta name="description" content="Sites de revisão com explicações, quizzes e joguinhos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilo.css">
<style>
a.mod{text-decoration:none}
</style>
</head>
<body>
<div class="wrap wide">
  <div class="hero">
    <div class="toprow"><span class="eyebrow">6º ano</span></div>
    <h1>Revisões</h1>
    <div class="pac">
      <div class="pac-board">
        <span class="pac-doodle tl" aria-hidden="true">A B C</span><span class="pac-doodle tr" aria-hidden="true">2+3=5</span>
        <span class="pac-doodle bl" aria-hidden="true">SPQR</span><span class="pac-doodle br" aria-hidden="true">1 2 3</span>
        <span class="pac-name"><span class="pac-sr">Professora Ana Clara</span><span aria-hidden="true">Prof<span class="pac-ord">a</span> Ana Clara</span></span>
      </div>
      <div class="pac-tray" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="er"></i></div>
    </div>
    <p class="sub">Escolha a matéria. Cada site tem explicação, quiz e joguinhos.</p>
  </div>

  <!-- Para cada matéria nova, copie um destes <a> e troque o link, a cor, a sigla e os textos. -->
  <div class="grid">
    <a class="mod" href="historia/" style="--c:#FFC98A">
      <span class="badge sm" style="background:#FFC98A">HIS</span>
      <span class="mt"><h2>História</h2><p>Módulos 14 e 15 · Roma antiga</p></span>
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>
    <a class="mod" href="modelo/" style="--c:#C9B6FF">
      <span class="badge" style="background:#C9B6FF">?</span>
      <span class="mt"><h2>Modelo</h2><p>Base para criar a próxima matéria</p></span>
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>
  </div>
</div>
</body>
</html>
